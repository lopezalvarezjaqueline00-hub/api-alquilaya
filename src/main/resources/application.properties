spring.application.name=alquilaya

# Puerto del servidor (variable de entorno SERVER_PORT, por defecto 8080)
server.port=${SERVER_PORT:8080}

# Conexión a MySQL. Los valores se toman de variables de entorno;
# si no existen se usan los valores por defecto para desarrollo local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/alquilaya?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root1234}

# Hibernate crea/actualiza las tablas automáticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
