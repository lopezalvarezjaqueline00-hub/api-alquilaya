# Configuración SOLO para las pruebas: usa una base de datos H2 en memoria,
# así "mvnw test" funciona aunque MySQL no esté encendido.
spring.application.name=alquilaya
spring.datasource.url=jdbc:h2:mem:alquilaya;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
